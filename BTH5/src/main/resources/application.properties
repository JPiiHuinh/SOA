spring.application.name=reporting-service
server.port=8083

spring.datasource.url=${REPORTING_DB_URL:jdbc:mysql://localhost:3306/reporting_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${REPORTING_DB_USERNAME:root}
spring.datasource.password=${REPORTING_DB_PASSWORD:rootpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
order.service.url=${ORDER_SERVICE_URL:http://localhost:8082}
